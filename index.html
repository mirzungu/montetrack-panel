<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montetrack – Radni nalozi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root { --red:#DF2629; --navy:#1B1F38; --bg:#F5F6F8; --line:#E3E5EA; --muted:#6B7280; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#1F2330; font-size:14px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:8px 14px; }
  button:disabled { opacity:.6; cursor:wait; }
  .btn-red { background:var(--red); color:#fff; }
  .btn-red:hover { filter:brightness(.92); }
  .btn-ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35); }
  .btn-light { background:#fff; border:1px solid var(--line); }
  .btn-light:hover { background:#F3F4F6; }
  .btn-danger { background:#fff; color:var(--red); border:1px solid var(--red); }
  .btn-danger:hover { background:#FFF1F1; }
  input, select, textarea { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; width:100%; }
  input:focus, select:focus, textarea:focus { outline:2px solid rgba(223,38,41,.25); border-color:var(--red); }
  [hidden] { display:none !important; }

  #login { min-height:100vh; display:grid; place-items:center; }
  .login-card { background:#fff; padding:36px; border-radius:16px; width:340px; box-shadow:0 8px 30px rgba(0,0,0,.08); text-align:center; }
  .login-card img { width:170px; margin-bottom:24px; }
  .login-card input { margin-bottom:10px; }
  .login-card button { width:100%; padding:11px; }
  .err { color:var(--red); min-height:20px; margin:6px 0; }

  header { background:var(--navy); color:#fff; display:flex; align-items:center; gap:14px; padding:10px 24px; position:sticky; top:0; z-index:5; }
  header img { height:32px; }
  .brand b { display:block; letter-spacing:1.5px; font-size:16px; }
  .brand span { font-size:12px; opacity:.7; }
  header .spacer { flex:1; }
  #user { opacity:.75; font-size:13px; }

  main { padding:20px 24px; max-width:1500px; margin:0 auto; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 16px; min-width:120px; cursor:pointer; }
  .stat b { display:block; font-size:22px; }
  .stat.active { outline:2px solid var(--navy); }
  .toolbar { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar input { flex:1; min-width:220px; }
  .toolbar select { width:auto; }
  .toolbar.dates { align-items:center; gap:8px; }
  .toolbar.dates input[type=date] { flex:0 0 auto; width:auto; min-width:0; }
  .toolbar.dates button { padding:7px 12px; }
  .toolbar.dates button.on { background:var(--navy); color:#fff; border-color:var(--navy); }

  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#FAFBFC; font-weight:600; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#FFF6F6; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .muted { color:var(--muted); font-size:12px; }
  .mono { font-family:ui-monospace,Consolas,monospace; font-size:13px; }
  .empty { text-align:center; padding:40px; color:var(--muted); }

  #modal { position:fixed; inset:0; background:rgba(20,22,40,.45); display:grid; place-items:center; z-index:10; padding:20px; }
  .sheet { background:#fff; border-radius:14px; width:min(900px,100%); max-height:92vh; overflow:auto; }
  .sheet-head { background:var(--navy); color:#fff; padding:14px 22px; display:flex; align-items:center; position:sticky; top:0; z-index:2; }
  .sheet-head h2 { margin:0; font-size:17px; flex:1; }
  .sheet-body { padding:20px 22px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
  .grid .full { grid-column:1 / -1; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  h3 { font-size:14px; margin:22px 0 10px; color:var(--navy); border-bottom:1px solid var(--line); padding-bottom:6px; }
  .equip { display:grid; grid-template-columns:160px 1fr; gap:8px 12px; align-items:center; }
  .equip label.chk { display:flex; gap:8px; align-items:center; color:#1F2330; font-size:14px; margin:0; }
  .equip input[type=checkbox] { width:18px; height:18px; accent-color:var(--red); }
  .photos { display:flex; gap:10px; flex-wrap:wrap; }
  .photos img { width:150px; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; }
  .sheet-foot { padding:14px 22px; border-top:1px solid var(--line); display:flex; gap:10px; position:sticky; bottom:0; background:#fff; flex-wrap:wrap; }
  .sheet-foot .spacer { flex:1; }
  @media (max-width:700px) { .grid { grid-template-columns:1fr; } main, header { padding-left:12px; padding-right:12px; } }
</style>
</head>
<body>

<section id="login" hidden>
  <form class="login-card" id="login-form">
    <img src="logo_montetrack.png" alt="Montetrack" onerror="this.style.display='none'">
    <input id="email" type="email" placeholder="Email" required autocomplete="username">
    <input id="password" type="password" placeholder="Lozinka" required autocomplete="current-password">
    <div class="err" id="login-err"></div>
    <button class="btn-red" type="submit">Prijavi se</button>
  </form>
</section>

<section id="app" hidden>
  <header>
    <img src="logo_znak.png" alt="" onerror="this.style.display='none'">
    <div class="brand"><b>MONTETRACK</b><span>Radni nalozi – dispečerski panel</span></div>
    <div class="spacer"></div>
    <span id="user"></span>
    <button class="btn-ghost" id="btn-refresh">⟳ Osveži</button>
    <button class="btn-ghost" id="btn-csv">⬇ Excel</button>
    <button class="btn-ghost" id="btn-logout">Odjava</button>
  </header>

  <main>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input id="search" placeholder="Pretraga: broj, klijent, tablice, IMEI, ICCID, adresa…">
      <select id="f-status"></select>
      <select id="f-job"></select>
      <select id="f-tech"></select>
      <button class="btn-red" id="btn-new">+ Novi nalog</button>
    </div>
    <div class="toolbar dates">
      <select id="f-datefield">
        <option value="created_at">Datum kreiranja</option>
        <option value="updated_at">Datum izmene</option>
      </select>
      <span class="muted">od</span><input type="date" id="f-from">
      <span class="muted">do</span><input type="date" id="f-to">
      <button class="btn-light" data-range="today">Danas</button>
      <button class="btn-light" data-range="week">Ova nedelja</button>
      <button class="btn-light" data-range="month">Ovaj mesec</button>
      <button class="btn-light" data-range="lastmonth">Prošli mesec</button>
      <button class="btn-light" data-range="">✕ Svi datumi</button>
    </div>
    <table>
      <thead><tr>
        <th>Br.</th><th id="th-date">Kreiran</th><th>Klijent</th><th>Vozilo</th><th>Posao</th>
        <th>Status</th><th>Tehničar</th><th>IMEI / ICCID</th><th>Oprema</th><th>Slike</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
</section>

<div id="modal" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="modal-title">Nalog</h2>
      <button class="btn-ghost" id="btn-close">✕</button>
    </div>
    <form id="order-form" class="sheet-body">
      <div class="grid">
        <div><label>Status</label><select name="status" id="m-status"></select></div>
        <div><label>Tip posla</label><select name="job_type" id="m-job"></select></div>
        <div class="full"><label>Dodeljen tehničaru</label><select name="assigned_to" id="m-tech"></select></div>
      </div>

      <h3>Klijent</h3>
      <div class="grid">
        <div><label>Naziv klijenta</label><input name="client_name"></div>
        <div><label>Adresa</label><input name="address"></div>
      </div>

      <h3>Vozilo</h3>
      <div class="grid">
        <div><label>Registarske oznake</label><input name="vehicle_plate" style="text-transform:uppercase"></div>
        <div><label>Marka i model</label><input name="vehicle_model"></div>
        <div><label>Kilometraža / radni sati</label><input name="mileage" placeholder="npr. 125400 km ili 3200 h"></div>
      </div>

      <h3>GPS uređaj</h3>
      <div class="grid">
        <div><label>IMEI</label><input name="imei" class="mono"></div>
        <div><label>ICCID SIM kartice</label><input name="iccid" class="mono"></div>
      </div>

      <h3>Dodatna oprema</h3>
      <div class="equip" id="equip"></div>

      <h3>Fotografije vozila</h3>
      <div class="photos" id="photos"><span class="muted">Nema fotografija</span></div>

      <h3>Napomena</h3>
      <textarea name="notes" rows="3"></textarea>

      <h3>Potpisi</h3>
      <div class="grid">
        <div><label>Serviser (ime i prezime)</label><input name="technician_name"></div>
        <div><label>Kontakt osoba klijenta (ime i prezime)</label><input name="client_signer"></div>
      </div>
      <p class="muted" id="meta"></p>
    </form>
    <div class="sheet-foot">
      <button class="btn-light" id="btn-pdf">📄 PDF naloga</button>
      <button class="btn-light" id="btn-zip">🖼 Slike (ZIP)</button>
      <button class="btn-danger" id="btn-delete">🗑 Obriši</button>
      <div class="spacer"></div>
      <button class="btn-light" id="btn-cancel">Zatvori</button>
      <button class="btn-red" id="btn-save">Sačuvaj</button>
    </div>
  </div>
</div>

<script>
// ====== PODEŠAVANJA ======
const SUPABASE_URL = 'https://urtskscrqdeuuxbicslr.supabase.co';   // <-- vaš Project URL
const SUPABASE_KEY = 'sb_publishable_89hIx8mqPlEHs3cSFjfF_w_Ryl0zfbG';           // <-- vaš publishable key
const BUCKET = 'vehicle-photos';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUS = {
  DODELJEN: ['Dodeljen', '#6B7280'], U_DOLASKU: ['U dolasku', '#2563EB'],
  U_RADU: ['U radu', '#F59E0B'], ZAVRSEN: ['Završen', '#16A34A'], PROBLEM: ['Problem', '#DF2629']
};
const JOBS = { UGRADNJA: 'Ugradnja', SERVIS: 'Servis', ZAMENA: 'Zamena', DEMONTAZA: 'Demontaža' };
const EQUIP = [
  ['has_rfid', 'rfid_model', 'RFID'], ['has_can', 'can_model', 'CAN'],
  ['has_sonda', 'sonda_model', 'Sonda za gorivo'], ['has_protokomer', 'protokomer_model', 'Protokomer']
];

let orders = [];
let techs = [];
let editing = null;
let statusFilter = '';
let myId = null;
let myEmail = '';
let myRole = null;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => d ? new Date(d).toLocaleString('sr-Latn-RS',
  { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const statusLabel = s => (STATUS[s] || [s])[0];
const pill = s => {
  const [label, color] = STATUS[s] || [s, '#6B7280'];
  return `<span class="pill" style="background:${color}22;color:${color}">${esc(label)}</span>`;
};
const equipText = o => EQUIP.filter(([h]) => o[h]).map(([, , l]) => l).join(', ');
const techName = id => techs.find(t => t.id === id)?.full_name || '';
const serviserName = o => o.technician_name || techName(o.assigned_to);

function saveBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function signedUrls(paths) {
  if (!paths || !paths.length) return [];
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
  if (error) throw error;
  return data.filter(d => d.signedUrl).map(d => d.signedUrl);
}

// ====== Padajući meniji ======
const opts = (obj, first) => (first ? `<option value="">${first}</option>` : '') +
  Object.entries(obj).map(([k, v]) => `<option value="${k}">${Array.isArray(v) ? v[0] : v}</option>`).join('');
$('#f-status').innerHTML = opts(STATUS, 'Svi statusi');
$('#f-job').innerHTML = opts(JOBS, 'Svi poslovi');
$('#m-status').innerHTML = opts(STATUS);
$('#m-job').innerHTML = opts(JOBS);
$('#equip').innerHTML = EQUIP.map(([h, m, l]) =>
  `<label class="chk"><input type="checkbox" name="${h}"> ${l}</label>
   <input name="${m}" placeholder="Model / serijski broj">`).join('');

function fillTechSelects() {
  const list = techs.filter(t => t.role === 'tehnicar');
  const keep = $('#f-tech').value;
  $('#f-tech').innerHTML = '<option value="">Svi tehničari</option><option value="__none">Nedodeljeni</option>' +
    list.filter(t => t.active).map(t => `<option value="${esc(t.id)}">${esc(t.full_name)}</option>`).join('');
  $('#f-tech').value = keep;
  $('#m-tech').innerHTML = '<option value="">— nije dodeljen —</option>' +
    list.map(t => `<option value="${esc(t.id)}">${esc(t.full_name)}${t.active ? '' : ' (neaktivan)'}</option>`).join('');
}

// ====== Prijava ======
sb.auth.onAuthStateChange((event, session) => {
  if (['INITIAL_SESSION', 'SIGNED_IN', 'SIGNED_OUT'].includes(event)) showApp(session);
});

function showApp(session) {
  $('#login').hidden = !!session;
  $('#app').hidden = !session;
  myId = session?.user.id || null;
  myEmail = session?.user.email || '';
  if (session) { $('#user').textContent = myEmail; load(); }
}

$('#login-form').onsubmit = async e => {
  e.preventDefault();
  $('#login-err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('#email').value.trim(), password: $('#password').value
  });
  if (error) $('#login-err').textContent = error.message.includes('Invalid')
    ? 'Pogrešan email ili lozinka' : 'Greška: ' + error.message;
};
$('#btn-logout').onclick = () => sb.auth.signOut();

// ====== Učitavanje i prikaz ======
async function load() {
  const [o, p] = await Promise.all([
    sb.from('work_orders').select('*').order('updated_at', { ascending: false }).limit(2000),
    sb.from('profiles').select('*').order('full_name')
  ]);
  if (o.error) { alert('Greška pri učitavanju naloga: ' + o.error.message); return; }
  if (p.error) { alert('Greška pri učitavanju tehničara: ' + p.error.message); }
  orders = o.data;
  techs = p.data || [];
  const me = techs.find(t => t.id === myId);
  myRole = me?.role || null;
  $('#user').textContent = me?.full_name || myEmail;
  fillTechSelects();
  render();
}

// ====== Filter po datumu ======
const dateField = () => $('#f-datefield').value;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

function inDateRange(o) {
  const from = $('#f-from').value, to = $('#f-to').value;
  if (!from && !to) return true;
  const v = o[dateField()];
  if (!v) return false;
  const t = new Date(v);
  if (from && t < new Date(from + 'T00:00:00')) return false;
  if (to && t > new Date(to + 'T23:59:59.999')) return false;
  return true;
}

function setRange(kind) {
  const now = new Date();
  let from = '', to = '';
  if (kind === 'today') {
    from = to = ymd(now);
  } else if (kind === 'week') {
    const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    from = ymd(mon); to = ymd(now);
  } else if (kind === 'month') {
    from = ymd(new Date(now.getFullYear(), now.getMonth(), 1)); to = ymd(now);
  } else if (kind === 'lastmonth') {
    from = ymd(new Date(now.getFullYear(), now.getMonth() - 1, 1));
    to = ymd(new Date(now.getFullYear(), now.getMonth(), 0));
  }
  $('#f-from').value = from;
  $('#f-to').value = to;
  document.querySelectorAll('[data-range]').forEach(b =>
    b.classList.toggle('on', !!kind && b.dataset.range === kind));
  render();
}
document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => setRange(b.dataset.range));

function filtered() {
  const q = $('#search').value.trim().toLowerCase();
  const st = $('#f-status').value || statusFilter;
  const job = $('#f-job').value;
  const tech = $('#f-tech').value;
  return orders.filter(o =>
    inDateRange(o) &&
    (!st || o.status === st) &&
    (!job || o.job_type === job) &&
    (!tech || (tech === '__none' ? !o.assigned_to : o.assigned_to === tech)) &&
    (!q || [String(o.broj), o.client_name, o.vehicle_plate, o.vehicle_model, o.imei, o.iccid,
            o.address, o.mileage, o.technician_name, o.client_signer, techName(o.assigned_to)]
      .some(v => (v || '').toLowerCase().includes(q))));
}

function render() {
  const inRange = orders.filter(inDateRange);
  const counts = Object.fromEntries(Object.keys(STATUS).map(k => [k, 0]));
  inRange.forEach(o => { if (counts[o.status] !== undefined) counts[o.status]++; });
  $('#stats').innerHTML =
    `<div class="stat ${!statusFilter ? 'active' : ''}" data-s=""><span class="muted">Ukupno</span><b>${inRange.length}</b></div>` +
    Object.entries(STATUS).map(([k, [l, c]]) =>
      `<div class="stat ${statusFilter === k ? 'active' : ''}" data-s="${k}">
         <span class="muted">${l}</span><b style="color:${c}">${counts[k]}</b></div>`).join('');

  const df = dateField();
  $('#th-date').textContent = df === 'created_at' ? 'Kreiran' : 'Izmenjen';

  const list = filtered();
  $('#rows').innerHTML = list.length ? list.map(o => `
    <tr data-id="${esc(o.id)}">
      <td><b>${esc(o.broj)}</b></td>
      <td>${fmtDate(o[df])}</td>
      <td><b>${esc(o.client_name) || '<span class="muted">(bez imena)</span>'}</b><div class="muted">${esc(o.address)}</div></td>
      <td><b>${esc(o.vehicle_plate)}</b><div class="muted">${esc(o.vehicle_model)}${o.mileage ? ' · ' + esc(o.mileage) : ''}</div></td>
      <td>${esc(JOBS[o.job_type] || o.job_type)}</td>
      <td>${pill(o.status)}</td>
      <td>${esc(techName(o.assigned_to)) || '<span class="muted">—</span>'}</td>
      <td class="mono">${esc(o.imei)}<div class="muted mono">${esc(o.iccid)}</div></td>
      <td>${esc(equipText(o))}</td>
      <td>${(o.photos || []).length || ''}</td>
    </tr>`).join('') : `<tr><td colspan="10" class="empty">Nema naloga za prikaz</td></tr>`;
}

$('#stats').onclick = e => {
  const el = e.target.closest('.stat'); if (!el) return;
  statusFilter = el.dataset.s; $('#f-status').value = ''; render();
};
['#search', '#f-status', '#f-job', '#f-tech', '#f-datefield'].forEach(s => $(s).oninput = () => {
  if (s === '#f-status') statusFilter = '';
  render();
});
['#f-from', '#f-to'].forEach(s => $(s).onchange = () => {
  document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('on'));
  render();
});
$('#rows').onclick = e => {
  const tr = e.target.closest('tr[data-id]');
  if (tr) openOrder(orders.find(o => o.id === tr.dataset.id));
};
$('#btn-refresh').onclick = load;
$('#btn-new').onclick = () => openOrder(null);

// ====== Detalj naloga ======
async function openOrder(o) {
  editing = o;
  const f = $('#order-form');
  f.reset();
  $('#modal-title').textContent = o
    ? `Nalog br. ${o.broj} – ${o.client_name || o.vehicle_plate || ''}` : 'Novi nalog';
  $('#btn-pdf').hidden = !o;
  $('#btn-zip').hidden = !o || !(o.photos || []).length;
  $('#btn-delete').hidden = !o || myRole !== 'dispecer';
  if (o) {
    for (const el of f.elements) {
      if (!el.name) continue;
      if (el.type === 'checkbox') el.checked = !!o[el.name];
      else el.value = o[el.name] ?? '';
    }
    $('#meta').textContent = `Kreiran: ${fmtDate(o.created_at)} · Poslednja izmena: ${fmtDate(o.updated_at)}`;
  } else {
    $('#meta').textContent = '';
  }
  $('#photos').innerHTML = '<span class="muted">Nema fotografija</span>';
  $('#modal').hidden = false;

  if (o && (o.photos || []).length) {
    $('#photos').innerHTML = '<span class="muted">Učitavam fotografije…</span>';
    try {
      const urls = await signedUrls(o.photos);
      $('#photos').innerHTML = urls.map(u =>
        `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy"></a>`
      ).join('') || '<span class="muted">Fotografije još nisu poslate sa telefona</span>';
    } catch (e) {
      $('#photos').innerHTML = `<span class="muted">Greška: ${esc(e.message)}</span>`;
    }
  }
}

function closeModal() { $('#modal').hidden = true; editing = null; }
$('#btn-close').onclick = closeModal;
$('#btn-cancel').onclick = closeModal;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

$('#btn-save').onclick = async () => {
  const row = {};
  for (const el of $('#order-form').elements) {
    if (!el.name) continue;
    row[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim();
  }
  row.vehicle_plate = row.vehicle_plate.toUpperCase();
  row.assigned_to = row.assigned_to || null;
  $('#btn-save').disabled = true;
  const { error } = editing
    ? await sb.from('work_orders').update(row).eq('id', editing.id)
    : await sb.from('work_orders').insert(row);
  $('#btn-save').disabled = false;
  if (error) { alert('Čuvanje nije uspelo: ' + error.message); return; }
  closeModal();
  load();
};

// ====== Brisanje naloga ======
$('#btn-delete').onclick = async () => {
  const o = editing;
  if (!o) return;
  const name = o.client_name || o.vehicle_plate || 'bez imena';
  if (!confirm(`Obrisati nalog br. ${o.broj} (${name})?\n\n` +
               `Nalog i sve njegove fotografije biće trajno obrisani. Ovo se ne može vratiti.`)) return;

  const btn = $('#btn-delete');
  btn.disabled = true;
  const { data, error } = await sb.from('work_orders').delete().eq('id', o.id).select('id');
  btn.disabled = false;
  if (error) { alert('Brisanje nije uspelo: ' + error.message); return; }
  if (!data || !data.length) {
    alert('Nalog nije obrisan. Proverite da vaš nalog u tabeli profiles ima ulogu "dispecer".');
    return;
  }

  try {
    const paths = new Set(o.photos || []);
    const { data: files } = await sb.storage.from(BUCKET).list(o.id, { limit: 1000 });
    (files || []).forEach(f => paths.add(`${o.id}/${f.name}`));
    if (paths.size) {
      const { error: e2 } = await sb.storage.from(BUCKET).remove([...paths]);
      if (e2) throw e2;
    }
  } catch (e) {
    alert('Nalog je obrisan, ali fotografije nisu: ' + e.message);
  }

  closeModal();
  load();
};

$('#btn-pdf').onclick = () => editing && exportPdf(editing);
$('#btn-zip').onclick = () => editing && downloadPhotos(editing);

// ====== PDF radnog naloga ======
async function exportPdf(o) {
  // Prozor se otvara odmah, da ga browser ne bi blokirao
  const w = window.open('', '_blank');
  if (!w) { alert('Browser je blokirao novi prozor. Dozvolite pop-up prozore za ovaj sajt.'); return; }
  w.document.write('<p style="font-family:sans-serif;padding:20px">Pripremam radni nalog…</p>');

  let urls = [];
  try { urls = await signedUrls(o.photos); } catch (e) { /* PDF i bez slika */ }

  const logo = new URL('logo_montetrack.png', location.href).href;
  const row = (l, v) => `<tr><th>${l}</th><td>${esc(v) || '—'}</td></tr>`;
  const equipRows = EQUIP.map(([h, m, l]) =>
    `<tr><th>${l}</th><td>${o[h] ? 'Da' + (o[m] ? ' – ' + esc(o[m]) : '') : 'Ne'}</td></tr>`).join('');
  const photosHtml = urls.length ? `
    <div class="annex">
      <h2>Prilog: fotografije vozila (${urls.length})</h2>
      <div class="photos">${urls.map(u => `<img src="${esc(u)}">`).join('')}</div>
    </div>` : '';
  const title = `Radni nalog ${o.broj}${o.vehicle_plate ? ' - ' + o.vehicle_plate : ''}`;

  const html = `<!DOCTYPE html><html lang="sr"><head><meta charset="UTF-8">
<title>${esc(title)}</title>
<style>
  @page { size: A4; margin: 14mm; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #111; margin: 0;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .head { display: flex; justify-content: space-between; align-items: center;
          border-bottom: 3px solid #DF2629; padding-bottom: 8px; margin-bottom: 12px; }
  .head img { height: 50px; }
  .head h1 { font-size: 20px; margin: 0; text-align: right; }
  .head .sub { font-size: 11px; color: #555; text-align: right; }
  h2 { font-size: 12px; background: #1B1F38; color: #fff; padding: 5px 8px; margin: 14px 0 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #C9CCD3; padding: 5px 8px; text-align: left; vertical-align: top; }
  th { width: 36%; background: #F3F4F6; font-weight: 600; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .notes { border: 1px solid #C9CCD3; padding: 8px; min-height: 50px; white-space: pre-wrap; }
  .sign { display: flex; justify-content: space-between; margin-top: 40px; break-inside: avoid; }
  .sign > div { width: 42%; text-align: center; }
  .sign .sname { font-size: 13px; font-weight: 600; min-height: 18px; margin-bottom: 28px; }
  .sign .sline { border-top: 1px solid #333; padding-top: 4px; font-size: 11px; color: #444; }
  .annex { break-before: page; }
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .photos img { width: 100%; height: 75mm; object-fit: cover; border: 1px solid #C9CCD3; break-inside: avoid; }
  .foot { margin-top: 14px; font-size: 10px; color: #777; }
</style></head><body>
  <div class="head">
    <img src="${esc(logo)}" onerror="this.style.display='none'">
    <div><h1>RADNI NALOG br. ${esc(o.broj)}</h1>
      <div class="sub">Kreiran: ${fmtDate(o.created_at)} · Izmenjen: ${fmtDate(o.updated_at)}</div></div>
  </div>

  <div class="cols">
    <div><h2>Osnovni podaci</h2><table>
      ${row('Tip posla', JOBS[o.job_type] || o.job_type)}
      ${row('Status', statusLabel(o.status))}
      ${row('Tehničar', techName(o.assigned_to))}
    </table></div>
    <div><h2>Klijent</h2><table>
      ${row('Naziv', o.client_name)}
      ${row('Adresa', o.address)}
    </table></div>
  </div>

  <div class="cols">
    <div><h2>Vozilo</h2><table>
      ${row('Registarske oznake', o.vehicle_plate)}
      ${row('Marka i model', o.vehicle_model)}
      ${row('Kilometraža / radni sati', o.mileage)}
    </table></div>
    <div><h2>GPS uređaj</h2><table>
      ${row('IMEI', o.imei)}
      ${row('ICCID', o.iccid)}
    </table></div>
  </div>

  <h2>Dodatna oprema</h2>
  <table>${equipRows}</table>

  <h2>Napomena</h2>
  <div class="notes">${esc(o.notes) || '—'}</div>

  <div class="sign">
    <div>
      <div class="sname">${esc(serviserName(o))}</div>
      <div class="sline">Serviser</div>
    </div>
    <div>
      <div class="sname">${esc(o.client_signer)}</div>
      <div class="sline">Kontakt osoba klijenta</div>
    </div>
  </div>
  <div class="foot">Montetrack Telematics · dokument generisan ${fmtDate(new Date())}</div>

  ${photosHtml}
  <script>window.onload = () => setTimeout(() => window.print(), 300);<\/script>
</body></html>`;

  w.document.open();
  w.document.write(html);
  w.document.close();
}

// ====== Preuzimanje slika u ZIP-u ======
async function downloadPhotos(o) {
  const paths = o.photos || [];
  if (!paths.length) { alert('Ovaj nalog nema fotografija.'); return; }
  const btn = $('#btn-zip');
  btn.disabled = true;
  try {
    const zip = new JSZip();
    const base = (o.vehicle_plate || 'nalog').replace(/[^\w-]+/g, '_');
    for (let i = 0; i < paths.length; i++) {
      btn.textContent = `Preuzimam ${i + 1}/${paths.length}…`;
      const { data, error } = await sb.storage.from(BUCKET).download(paths[i]);
      if (error) throw error;
      zip.file(`${base}_${i + 1}.jpg`, data);
    }
    btn.textContent = 'Pakujem…';
    saveBlob(await zip.generateAsync({ type: 'blob' }), `nalog-${o.broj}-${base}.zip`);
  } catch (e) {
    alert('Preuzimanje nije uspelo: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🖼 Slike (ZIP)';
  }
}

// ====== Izvoz u Excel (CSV) ======
$('#btn-csv').onclick = () => {
  const cols = [
    ['broj', 'Broj'], ['created_at', 'Kreiran'], ['updated_at', 'Izmenjen'], ['status', 'Status'],
    ['job_type', 'Posao'], ['assigned_to', 'Tehničar'], ['client_name', 'Klijent'], ['address', 'Adresa'],
    ['vehicle_plate', 'Tablice'], ['vehicle_model', 'Vozilo'], ['mileage', 'Kilometraža / radni sati'],
    ['imei', 'IMEI'], ['iccid', 'ICCID'], ['rfid_model', 'RFID'], ['can_model', 'CAN'],
    ['sonda_model', 'Sonda'], ['protokomer_model', 'Protokomer'], ['notes', 'Napomena'],
    ['technician_name', 'Serviser'], ['client_signer', 'Kontakt osoba klijenta']
  ];
  const cell = (o, k) => {
    if (k === 'created_at' || k === 'updated_at') return fmtDate(o[k]);
    if (k === 'status') return statusLabel(o.status);
    if (k === 'job_type') return JOBS[o.job_type] || o.job_type;
    if (k === 'assigned_to') return techName(o.assigned_to);
    if (k === 'technician_name') return serviserName(o);
    if (k === 'imei' || k === 'iccid') return o[k] ? `="${o[k]}"` : '';
    const eq = EQUIP.find(([, m]) => m === k);
    if (eq) return o[eq[0]] ? (o[k] || 'Da') : '';
    return o[k] ?? '';
  };
  const lines = [cols.map(c => c[1]), ...filtered().map(o => cols.map(([k]) => cell(o, k)))]
    .map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';'));
  const from = $('#f-from').value, to = $('#f-to').value;
  const range = from || to ? `_${from || 'pocetak'}_do_${to || 'danas'}` : '';
  saveBlob(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }),
    `radni-nalozi-${new Date().toISOString().slice(0, 10)}${range}.csv`);
};

setInterval(() => { if (!$('#app').hidden && $('#modal').hidden) load(); }, 60000);
</script>
